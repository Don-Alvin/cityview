<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="CityView Printers">
  <!-- The four-bar mark from the CityView lockup (site-header.tsx), on the
       brand-deep ground. Authored as SVG rather than a binary .ico so the
       brand mark lives in readable source, and so it replaces the
       create-next-app default favicon that shipped with the scaffold. -->
  <rect width="32" height="32" rx="7" fill="#141312" />
  <g fill="#eaa221">
    <rect x="6" y="18" width="3.6" height="8" rx="0.4" />
    <rect x="11.5" y="12.3" width="3.6" height="13.7" rx="0.4" />
    <rect x="17" y="7" width="3.6" height="19" rx="0.4" />
    <rect x="22.5" y="14.7" width="3.6" height="11.3" rx="0.4" />
  </g>
</svg>
